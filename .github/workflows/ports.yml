#
# The Mac and Windows ports on REAL machines (owner, 2026-10-08: «non ho né un Mac né un Windows per provarla»).
# Each port is built from this commit's Linux code (Aurora_<port>/build.py), its requirements installed from PyPI,
# its platform tests run, and probe.py calls the platform backend for real on the runner (a socket of ours must be
# listening, a lock must stop another process, a system folder must be the administrators'...): a failure there
# fails the job. Then the whole Linux suite on the built tree, for information only (phase 3 is not done: what
# fails is its work list). Run by hand (Actions → Ports → Run workflow) and on every release tag.
name: Ports

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  port:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the code in a folder of our own: the repository's name ends with a dot (A.U.R.O.R.A.), which Windows takes
          # off folder names, so the runner's workspace D:\a\A.U.R.O.R.A.\A.U.R.O.R.A. «does not exist» (v0.2.0's run)
          - os: macos-latest          # Apple Silicon
            port: Aurora_mac
            home: /Users/runner/
          - os: windows-latest        # x64
            port: Aurora_windows
            home: "C:/"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"           # as Aurora's services run on Windows (sys_platform.process_env)
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.home }}aurora
    steps:
      - name: The code of this commit (public repository, no token)
        working-directory: ${{ matrix.home }}
        run: |
          git init -q aurora && cd aurora
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD && git log -1 --format='%h %s'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System tools (ffmpeg, poppler) — the installer's job in phase 3
        working-directory: ${{ matrix.home }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg poppler; else choco install -y --no-progress ffmpeg poppler; fi
      - name: Build the port
        run: python ${{ matrix.port }}/build.py
      - name: Requirements from PyPI (the built tree's)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../Aurora_build/${{ matrix.port }}/requirements.txt
      - name: Platform tests and the probe on this machine
        run: python ${{ matrix.port }}/build.py --test --probe --json probe-${{ matrix.port }}.json
      - name: The whole Linux suite on the built tree (information for phase 3)
        continue-on-error: true
        run: |
          python ${{ matrix.port }}/build.py --suite 2>&1 | tee suite-${{ matrix.port }}.txt
          rc=${PIPESTATUS[0]}; echo "$rc" > suite-rc.txt; exit "$rc"
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, re
          port = "${{ matrix.port }}"
          f = pathlib.Path(f"probe-{port}.json")
          print(f"## {port} on ${{ matrix.os }}")
          if f.exists():
              d = json.loads(f.read_text(encoding="utf-8"))
              print(f"Python {d['python'].split()[0]}, backend {d['backend']}\n\n| check | status | value |\n|---|---|---|")
              for r in d["rows"]:
                  v = (r.get("why") or r.get("error") or r.get("value") or "").replace("|", "\\|")[:160]
                  print(f"| {r['check']} | {r['status']} | {v} |")
          s = pathlib.Path(f"suite-{port}.txt")
          if s.exists():
              text = s.read_text(encoding="utf-8", errors="replace")
              tail = [l for l in text.splitlines() if re.search(r"\d+ (passed|failed)", l)]
              print(f"\n**Linux suite on the built tree:** {tail[-1] if tail else 'no summary'}")
              failed = sorted({l.split(' ')[1].split('::')[0] for l in text.splitlines() if l.startswith('FAILED ')})
              if failed:
                  print("\nFiles with failures (phase 3's list): " + ", ".join(f"`{x}`" for x in failed))
          PY
      - name: Results as public notices (readable without logging in, through the API's annotations)
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, re
          port = "${{ matrix.port }}"
          f = pathlib.Path(f"probe-{port}.json")
          if f.exists():
              rows = json.loads(f.read_text(encoding="utf-8"))["rows"]
              bad = [f"{r['check']}: {r.get('why') or r.get('error')}" for r in rows if r["status"] == "FAIL"]
              n = {k: sum(r["status"] == k for r in rows) for k in ("ok", "FAIL", "info")}
              print(f"::notice title={port} probe::{len(rows)} checks, {n['ok']} ok, {n['FAIL']} failed, {n['info']} info"
                    + ("%0A" + "%0A".join(bad)[:3000] if bad else ""))
              info = [f"{r['check']} = {r.get('value')}"[:160] for r in rows if r["status"] == "info"]
              print(f"::notice title={port} probe values::" + "%0A".join(info)[:4000])
          s = pathlib.Path(f"suite-{port}.txt")
          if s.exists():
              text = s.read_text(encoding="utf-8", errors="replace")
              rc = pathlib.Path("suite-rc.txt").read_text().strip() if pathlib.Path("suite-rc.txt").exists() else "?"
              tail = [l for l in text.splitlines() if re.search(r"\d+ (passed|failed|error)", l)]
              failed = sorted({l.split(" ")[1].split("::")[0] for l in text.splitlines() if l.startswith(("FAILED ", "ERROR "))})
              print(f"::notice title={port} Linux suite::exit {rc}; {tail[-1] if tail else 'no summary'}"
                    + (f"%0Afiles with failures: {', '.join(failed)}"[:3000] if failed else "")
                    + ("%0Alast lines:%0A" + "%0A".join(text.splitlines()[-12:])[:2500] if not tail else ""))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.port }}-results
          path: |
            ${{ matrix.home }}aurora/probe-${{ matrix.port }}.json
            ${{ matrix.home }}aurora/suite-${{ matrix.port }}.txt
          if-no-files-found: ignore
