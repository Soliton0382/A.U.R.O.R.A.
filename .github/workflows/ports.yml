#
# The Mac and Windows ports on REAL machines (owner, 2026-10-08: «non ho né un Mac né un Windows per provarla»).
# Each port is built from this commit's Linux code (Aurora_<port>/build.py), its requirements installed from PyPI,
# its platform tests run, and probe.py calls the platform backend for real on the runner (a socket of ours must be
# listening, a lock must stop another process, a system folder must be the administrators'...): a failure there
# fails the job. Then the whole Linux suite on the built tree, for information only (phase 3 is not done: what
# fails is its work list). Run by hand (Actions → Ports → Run workflow) and on every release tag.
name: Ports

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  port:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # Apple Silicon
            port: Aurora_mac
          - os: windows-latest        # x64
            port: Aurora_windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"           # as Aurora's services run on Windows (sys_platform.process_env)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System tools (ffmpeg, poppler) — the installer's job in phase 3
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg poppler; else choco install -y --no-progress ffmpeg poppler; fi
      - name: Build the port
        run: python ${{ matrix.port }}/build.py
      - name: Requirements from PyPI (the built tree's)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../Aurora_build/${{ matrix.port }}/requirements.txt
      - name: Platform tests and the probe on this machine
        run: python ${{ matrix.port }}/build.py --test --probe --json probe-${{ matrix.port }}.json
      - name: The whole Linux suite on the built tree (information for phase 3)
        continue-on-error: true
        run: |
          set -o pipefail
          python ${{ matrix.port }}/build.py --suite 2>&1 | tee suite-${{ matrix.port }}.txt
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, re
          port = "${{ matrix.port }}"
          f = pathlib.Path(f"probe-{port}.json")
          print(f"## {port} on ${{ matrix.os }}")
          if f.exists():
              d = json.loads(f.read_text(encoding="utf-8"))
              print(f"Python {d['python'].split()[0]}, backend {d['backend']}\n\n| check | status | value |\n|---|---|---|")
              for r in d["rows"]:
                  v = (r.get("why") or r.get("error") or r.get("value") or "").replace("|", "\\|")[:160]
                  print(f"| {r['check']} | {r['status']} | {v} |")
          s = pathlib.Path(f"suite-{port}.txt")
          if s.exists():
              text = s.read_text(encoding="utf-8", errors="replace")
              tail = [l for l in text.splitlines() if re.search(r"\d+ (passed|failed)", l)]
              print(f"\n**Linux suite on the built tree:** {tail[-1] if tail else 'no summary'}")
              failed = sorted({l.split(' ')[1].split('::')[0] for l in text.splitlines() if l.startswith('FAILED ')})
              if failed:
                  print("\nFiles with failures (phase 3's list): " + ", ".join(f"`{x}`" for x in failed))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.port }}-results
          path: |
            probe-${{ matrix.port }}.json
            suite-${{ matrix.port }}.txt
          if-no-files-found: ignore
