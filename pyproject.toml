[project]
name = "aurora"
version = "0.2.3"
description = "A.U.R.O.R.A.: a local AI that answers only from knowledge it can show, remembers, dreams and repairs herself under her owner's approval."
requires-python = ">=3.14"
license = "Apache-2.0"

[project.urls]
Repository = "https://github.com/Soliton0382/A.U.R.O.R.A."
Issues = "https://github.com/Soliton0382/A.U.R.O.R.A./issues"

[tool.pytest.ini_options]
pythonpath = ["sys/core", "sys/core/tests"]
testpaths = ["sys/core/tests"]
addopts = "-q"
