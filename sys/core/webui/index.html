<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Aurora</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/css/themes.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/assets/icon-192.png">
<link rel="apple-touch-icon" href="/static/assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aurora">
</head>
<body>
<!-- The shell only: every piece of content is a module (js/modules.js). -->
<div id="slot-background" aria-hidden="true"></div>

<div id="login" class="login hidden">
  <form id="login-form" class="card">
    <h1>Aurora</h1>
    <p data-i18n="login.hint"></p>
    <input id="login-key" type="password" autocomplete="current-password" data-i18n-placeholder="login.key" required>
    <button type="submit" data-i18n="login.enter"></button>
    <p id="login-error" class="error hidden" data-i18n="login.error"></p>
    <button type="button" id="login-to-user" class="link hidden" data-i18n="login.as_user"></button>
  </form>
  <form id="login-user" class="card hidden">
    <h1>Aurora</h1>
    <p data-i18n="login.user_hint"></p>
    <input id="login-name" autocomplete="username" autocapitalize="none" data-i18n-placeholder="login.name" required>
    <input id="login-password" type="password" autocomplete="current-password" data-i18n-placeholder="login.password" required>
    <div id="login-enroll" class="hidden">
      <p data-i18n="login.enroll"></p>
      <div id="login-qr"></div>
      <p class="muted"><span data-i18n="login.secret"></span> <code id="login-secret"></code></p>
    </div>
    <input id="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-i18n-placeholder="login.code">
    <button type="submit" data-i18n="login.enter"></button>
    <p id="login-user-error" class="error hidden"></p>
    <button type="button" id="login-to-key" class="link" data-i18n="login.with_key"></button>
  </form>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <button id="menu" class="icon" aria-label="menu">☰</button>
    <div class="brand-box">
      <div class="brand-row"><span class="brand">Aurora</span><span id="slot-health"></span></div>
      <div id="slot-alerts"></div>
    </div>
    <div id="slot-topbar" class="slot-topbar"></div>
  </header>
  <aside id="drawer" class="drawer">
    <nav id="nav"></nav>
    <div id="who" class="who hidden"></div>
    <div class="drawer-foot">
      <select id="lang" aria-label="language">
        <option value="it_IT">Italiano</option>
        <option value="en_US">English</option>
      </select>
      <button id="theme" type="button" class="icon" data-i18n-title="theme.title">🎨</button>
      <button id="logout" type="button" class="logout" data-i18n="nav.logout"></button>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>
  <main id="views"></main>
</div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
