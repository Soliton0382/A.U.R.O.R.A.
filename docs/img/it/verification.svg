<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d">
<title id="t">Verifica delle frasi: chi sbaglia e come</title>
<desc id="d">32 frasi reali giudicate da Claude (opus) · M32. frasi corrette scartate (su 18): passaggi citati
(prima) 4, citati,
frase in inglese 2, tutti i passaggi
(ora) 6, tutti,
in inglese 2, tutti,
italiano o inglese 1; frasi non supportate tenute (su 14): passaggi citati
(prima) 8, citati,
frase in inglese 12, tutti i passaggi
(ora) 0, tutti,
in inglese 4, tutti,
italiano o inglese 4</desc>
